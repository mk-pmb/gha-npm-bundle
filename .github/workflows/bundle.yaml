%YAML 1.1
# ^-- ATTN: [2019-12-31] If you use a later version, Github will fail
#     with a bogus error message "You have an error in your yaml syntax".
# -*- coding: UTF-8, tab-width: 2 -*-
---

name: '📦 Bundle'

on:
  workflow_dispatch:
    inputs:
      todo:
        description: 'Package name(s) and optionally version(s) to bundle'
        required: True
        type: string


jobs:
  job_ci_bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mk-pmb/github-ci-util-2405-pmb/act/install@experimental
      - run: 'ghciu ./bundle.sh --env-todo'
        env:
          TODO: '${{ inputs.todo }}'
      - uses: actions/upload-artifact@v6
        with:
          name: '${{ env.ARTIFACT_NAME }}'
          path: tmp.bundled/



...
